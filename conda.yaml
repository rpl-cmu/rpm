# conda env create --file conda.yaml
name: mmwcas
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.10
  - cuda-nvcc=12.2.140
  - cmake=3.27.9
  - open3d
  - numba
  - pip
  - pip:
    - "jax[cuda12]==0.5.0"
    - optax
    - jaxtyping
    - pyparsing
    - pyhocon
    - tqdm
    - matplotlib
    - pathlib
    - pyyaml
    - opencv-python
    - scikit-image
    - pytransform3d
    - imageio
    - imageio-ffmpeg
    - rosbags
    - tyro